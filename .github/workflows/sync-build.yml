name: Build DeskBox with Todo hot reload

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip the upstream test suite (faster publish)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  build:
    name: Build and publish win-x64
    runs-on: windows-latest
    env:
      RestoreLockedMode: true
      DOTNET_CLI_UI_LANGUAGE: en-US
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Todo sync wiring (idempotent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/apply_sync_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/apply_sync_patch.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\DeskBox.sln --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build
        shell: pwsh
        run: >-
          dotnet build .\src\DeskBox\DeskBox.csproj
          --configuration Release --no-restore
          -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          -p:DeskBoxRustNative=false -p:DeskBoxShellThumbnailProxy=false
          -v:minimal

      - name: Test
        # The upstream suite takes several minutes and does not gate packaging.
        # Opt in explicitly from a manual run when touching ViewModel code.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests == 'false' }}
        timeout-minutes: 12
        shell: pwsh
        run: >-
          dotnet test .\tests\DeskBox.Tests\DeskBox.Tests.csproj
          --configuration Release --no-restore
          -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          -p:DeskBoxRustNative=false -p:DeskBoxShellThumbnailProxy=false
          -p:WindowsAppSdkBootstrapInitialize=false
          --logger "trx;LogFileName=test-results.trx" -v:minimal

      - name: Publish
        shell: pwsh
        run: >-
          dotnet publish .\src\DeskBox\DeskBox.csproj
          --configuration Release --no-restore
          --output .artifacts\publish
          -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          -p:DeskBoxDistribution=Direct
          -p:PublishAot=false
          -p:DeskBoxRustNative=false
          -p:DeskBoxShellThumbnailProxy=false
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=false
          -v:minimal

      - name: Restore retail PRI and WinAppSDK Insights resource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A plain Release publish emits a ~615 KB DeskBox.pri WITHOUT the merged
          # WinUI framework resources. DeskBox then dies at startup with
          # "Cannot locate resource from ms-appx:///Microsoft.UI.Xaml/Themes/themeresources.xaml".
          # The retail AOT package carries a ~2.8 MB merged pri. The WinAppSDK
          # component payload also omits Microsoft.WindowsAppRuntime.Insights.Resource.dll
          # (upstream publish-aot-retail.ps1 restores it manually).
          # These two files are extracted from the matching official x64 release
          # and stored under patches/runtime; refresh them when upstream ships a
          # new version with changed XAML resources.
          Copy-Item -LiteralPath 'patches/runtime/DeskBox.pri' -Destination '.artifacts/publish/DeskBox.pri' -Force
          Copy-Item -LiteralPath 'patches/runtime/Microsoft.WindowsAppRuntime.Insights.Resource.dll' -Destination '.artifacts/publish/' -Force
          $pri = Get-Item -LiteralPath '.artifacts/publish/DeskBox.pri'
          if ($pri.Length -lt 2000000) { throw "DeskBox.pri is not the merged retail index ($($pri.Length) bytes)." }
          Write-Host "retail DeskBox.pri = $($pri.Length) bytes; Insights resource restored."

      - name: Read version and package
        shell: pwsh
        run: |
          [xml]$proj = Get-Content .\src\DeskBox\DeskBox.csproj -Raw
          $version = ($proj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          if (-not $version) { $version = "dev" }
          "DESKBOX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Test-Path .artifacts\publish\DeskBox.exe)) { throw "DeskBox.exe was not published." }
          New-Item -ItemType Directory -Path .artifacts\dist -Force | Out-Null
          Compress-Archive -Path .artifacts\publish\* -DestinationPath ".artifacts\dist\DeskBox-DidaSync-$version-win-x64.zip" -Force
          Get-ChildItem .artifacts\dist | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskBox-DidaSync-${{ env.DESKBOX_VERSION }}-win-x64
          path: .artifacts/dist/*.zip
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskBox.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
