name: Build DeskBox with Todo sync (Native AOT)

# Produces the same retail shape as the upstream release:
#   Native AOT single-file DeskBox.exe + DeskBox.ThumbnailProxy.exe + deskbox_native.dll
#   + merged DeskBox.pri + WindowsAppRuntime Insights resource.
# A plain (PublishAot=false) publish is NOT usable: it ships a 339 KB apphost without
# the Rust natives, and the unmerged 615 KB pri makes DeskBox die on
# "Cannot locate resource from ms-appx:///Microsoft.UI.Xaml/Themes/themeresources.xaml".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip the upstream test suite (faster publish)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  build:
    name: Build and publish win-x64 (Native AOT)
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
      DOTNET_NOLOGO: '1'
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Todo sync wiring (idempotent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/apply_sync_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/apply_sync_patch.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: 'ga'

      - name: Setup Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            $rustupInit = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $rustupInit
            & $rustupInit -y --profile minimal --default-toolchain 1.96.0 --target x86_64-pc-windows-msvc --no-modify-path
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE." }
          }
          # rust-toolchain.toml pins 1.96.0 plus clippy/rustfmt and both MSVC targets.
          & (Join-Path $cargoBin 'rustup.exe') toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed with exit code $LASTEXITCODE." }
          "PATH=$cargoBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $cargoBin 'cargo.exe') --version
          & (Join-Path $cargoBin 'rustc.exe') --version

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Restore with the same AOT properties the publish uses, and restore the
          # Updater project too: publish builds it as a dependency and fails with
          # NETSDK1004 when its assets file is missing.
          $common = @(
            '-p:Platform=x64',
            '-p:RuntimeIdentifier=win-x64',
            '-p:DeskBoxDistribution=Direct',
            '-p:DeskBoxAotAudit=true',
            '-p:DeskBoxAotSmokeHarness=false',
            '-p:PublishAot=true',
            '-p:DeskBoxRustNative=true',
            '-p:DeskBoxRustCrtLinkage=Static',
            '-p:JsonSerializerIsReflectionEnabledByDefault=false',
            '-p:IlcUseEnvironmentalTools=true',
            '-p:SelfContained=true',
            '-p:WindowsAppSDKSelfContained=true'
          )
          foreach ($project in @('.\src\DeskBox\DeskBox.csproj', '.\src\DeskBox.Updater\DeskBox.Updater.csproj')) {
            dotnet restore $project @common -v:minimal
            if ($LASTEXITCODE -ne 0) { throw "restore failed for $project." }
          }

      - name: Test (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests == 'false' }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          dotnet test .\tests\DeskBox.Tests\DeskBox.Tests.csproj --configuration Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:DeskBoxRustNative=false -p:DeskBoxShellThumbnailProxy=false -p:WindowsAppSdkBootstrapInitialize=false --logger "trx;LogFileName=test-results.trx" -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "tests failed." }

      - name: Publish Native AOT retail
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\rust-arm64-msvc-environment.ps1
          $toolchain = Get-DeskBoxMsvcEnvironment -Platform x64
          $msvcState = Enter-DeskBoxMsvcEnvironment -Toolchain $toolchain
          try {
            dotnet publish .\src\DeskBox\DeskBox.csproj `
              --configuration Release `
              --output .artifacts\publish `
              -p:Platform=x64 `
              -p:RuntimeIdentifier=win-x64 `
              -p:DeskBoxDistribution=Direct `
              -p:DeskBoxAotAudit=true `
              -p:DeskBoxAotSmokeHarness=false `
              -p:PublishAot=true `
              -p:DeskBoxRustNative=true `
              -p:DeskBoxRustCrtLinkage=Static `
              -p:JsonSerializerIsReflectionEnabledByDefault=false `
              -p:IlcUseEnvironmentalTools=true `
              -p:SelfContained=true `
              -p:WindowsAppSDKSelfContained=true `
              -p:PublishSingleFile=false `
              -v:minimal
            if ($LASTEXITCODE -ne 0) { throw "Native AOT publish failed with exit code $LASTEXITCODE." }
          }
          finally {
            Exit-DeskBoxMsvcEnvironment -State $msvcState
          }

      - name: Restore WinAppSDK Insights resource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # WindowsAppSDK 2.5.1 resolves a Foundation payload whose self-contained
          # component omits this signed resource DLL; the matching Runtime framework
          # MSIX carries it. Upstream publish-aot-retail.ps1 extracts it the same way.
          # Without it, native toast registration fails with 0x8007007E.
          $assetsPath = 'src/DeskBox/obj/project.assets.json'
          if (-not (Test-Path -LiteralPath $assetsPath)) { throw "assets file missing: $assetsPath" }
          $assets = Get-Content -LiteralPath $assetsPath -Raw | ConvertFrom-Json
          $runtimeLib = $assets.libraries.PSObject.Properties |
            Where-Object Name -Like 'Microsoft.WindowsAppSDK.Runtime/*' |
            Select-Object -First 1
          if (-not $runtimeLib) { throw 'Microsoft.WindowsAppSDK.Runtime package is not restored.' }

          $packageRelativePath = [string]$runtimeLib.Value.path
          $msixRelative = 'tools/MSIX/win10-x64/Microsoft.WindowsAppRuntime.2.msix'
          $msix = $null
          foreach ($root in @($assets.packageFolders.PSObject.Properties.Name)) {
            $candidate = Join-Path (Join-Path $root $packageRelativePath) $msixRelative
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { $msix = $candidate; break }
          }
          if (-not $msix) { throw "framework MSIX not found: $msixRelative" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($msix)
          try {
            $entry = $archive.Entries |
              Where-Object { $_.Name -eq 'Microsoft.WindowsAppRuntime.Insights.Resource.dll' } |
              Select-Object -First 1
            if (-not $entry) { throw 'Insights resource dll is not inside the framework MSIX.' }
            $destination = Join-Path '.artifacts/publish' 'Microsoft.WindowsAppRuntime.Insights.Resource.dll'
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $true)
            Write-Host "Restored Insights resource from $msix"
          }
          finally {
            $archive.Dispose()
          }

      - name: Verify retail payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = '.artifacts\publish'
          $required = @(
            'DeskBox.exe',
            'DeskBox.pri',
            'DeskBox.ThumbnailProxy.exe',
            'deskbox_native.dll',
            'Microsoft.WindowsAppRuntime.Insights.Resource.dll'
          )
          $missing = @()
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $publish $name))) { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Retail payload is incomplete; missing: $($missing -join ', ')" }

          $pri = Get-Item -LiteralPath (Join-Path $publish 'DeskBox.pri')
          if ($pri.Length -lt 2000000) {
            throw "DeskBox.pri is only $($pri.Length) bytes; the merged WinUI resource index is missing."
          }
          $exe = Get-Item -LiteralPath (Join-Path $publish 'DeskBox.exe')
          if ($exe.Length -lt 20000000) {
            throw "DeskBox.exe is only $($exe.Length) bytes; this is not a Native AOT image."
          }
          $proxy = Get-Item -LiteralPath (Join-Path $publish 'DeskBox.ThumbnailProxy.exe')
          $native = Get-Item -LiteralPath (Join-Path $publish 'deskbox_native.dll')
          Write-Host "DeskBox.exe        = $($exe.Length) bytes"
          Write-Host "DeskBox.pri        = $($pri.Length) bytes"
          Write-Host "ThumbnailProxy.exe = $($proxy.Length) bytes"
          Write-Host "deskbox_native.dll = $($native.Length) bytes"

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Item '.artifacts\publish\DeskBox.exe').VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($version)) { $version = 'dev' }
          "DESKBOX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path .artifacts\dist -Force | Out-Null
          Compress-Archive -Path .artifacts\publish\* -DestinationPath ".artifacts\dist\DeskBox-DidaSync-$version-win-x64.zip" -Force
          Get-ChildItem .artifacts\dist | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskBox-DidaSync-${{ env.DESKBOX_VERSION }}-win-x64
          path: .artifacts/dist/*.zip
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskBox.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
