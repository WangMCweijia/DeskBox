name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    env:
      # Locked mode is now opt-in per restore: a runner-image SDK bump
      # (ILLink.Tasks 10.0.14 -> 10.0.15) fails the job with NU1004 before a
      # single test runs, which is an environment change, not a code change.
      RestoreLockedMode: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit message attribution check
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $messages = git log --format=%B "${{ github.event.pull_request.base.sha }}..HEAD"
          if ($messages -match '(?im)^\s*(co-authored-by|generated[ -]with|generated-by)\s*[: ]') {
            Write-Host 'Forbidden attribution trailer (Co-Authored-By / Generated with) found in commit messages.'
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          # Re-evaluate so a toolchain patch bump cannot poison the run. The
          # refreshed lock files are never committed back, so the repo keeps
          # its pinned versions for local work.
          dotnet restore .\DeskBox.sln --force-evaluate -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build
        run: dotnet build .\src\DeskBox\DeskBox.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal

      - name: Test
        timeout-minutes: 10
        run: dotnet test .\tests\DeskBox.Tests\DeskBox.Tests.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:WindowsAppSdkBootstrapInitialize=false --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=test-results.trx" -v:minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskBox.Tests/TestResults/**/*.trx
